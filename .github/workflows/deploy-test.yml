name: Deploy Customer Frontend to Test Environment

# 客服前端自动部署工作流
# 触发条件：
# - test 分支的 push 事件
# - test 分支的 pull request 事件
# 构建环境：预发布环境 (prod) 生产环境(临时使用)
# 部署目标：测试服务器

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

env:
  # 构建环境配置
  BUILD_MODE: prod
  API_BASE_URL: https://chat-t.zmyyc.com/api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.yarn/cache
            ${{ github.workspace }}/.yarn/install-state.gz
          key: ${{ runner.os }}-yarn-test-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-test-

      - name: Install dependencies
        run: |
          echo "📦 安装依赖..."
          yarn install --frozen-lockfile
          echo "✅ 依赖安装完成"

      - name: Check configuration files
        run: |
          echo "🔍 检查配置文件..."
          if [ -f "config/${{ env.BUILD_MODE }}.ts" ]; then
            echo "✅ 配置文件 config/${{ env.BUILD_MODE }}.ts 存在"
          else
            echo "❌ 配置文件 config/${{ env.BUILD_MODE }}.ts 不存在"
            exit 1
          fi

      - name: Run linting
        run: |
          echo "🔍 运行代码检查..."
          if yarn lint 2>/dev/null; then
            echo "✅ 代码检查通过"
          else
            echo "⚠️ 代码检查失败，但继续构建..."
          fi

      - name: Run tests
        run: |
          echo "🧪 运行测试..."
          if yarn test --watchAll=false --passWithNoTests 2>/dev/null; then
            echo "✅ 测试通过"
          else
            echo "⚠️ 测试失败，但继续构建..."
          fi

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      build-version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.yarn/cache
            ${{ github.workspace }}/.yarn/install-state.gz
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-yarn-build-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-build-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/dist
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: |
          echo "📦 安装依赖..."
          yarn install --frozen-lockfile

      - name: Generate build version
        id: version
        run: |
          echo "version=${{ github.sha }}-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build H5 application
        run: |
          echo "🏗️ 构建H5应用..."
          echo "构建模式: ${{ env.BUILD_MODE }}"
          echo "API URL: ${{ env.API_BASE_URL }}"
          echo "使用配置文件: config/${{ env.BUILD_MODE }}.ts"

          # 开始构建计时
          BUILD_START=$(date +%s)

          yarn build:h5 --mode ${{ env.BUILD_MODE }}

          # 计算构建时间
          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          echo "⏱️ 构建耗时: ${BUILD_DURATION}秒"
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "🔍 验证构建产物..."
          if [ -f "dist/index.html" ]; then
            echo "✅ index.html 存在"
          else
            echo "❌ index.html 不存在"
            exit 1
          fi

          if [ -d "dist/js" ] && [ "$(ls -A dist/js/*.js 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "✅ JS文件存在"
            echo "📊 JS文件数量: $(ls -A dist/js/*.js 2>/dev/null | wc -l)"
          else
            echo "❌ JS文件不存在"
            exit 1
          fi

          if [ -d "dist/css" ] && [ "$(ls -A dist/css/*.css 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "✅ CSS文件存在"
            echo "📊 CSS文件数量: $(ls -A dist/css/*.css 2>/dev/null | wc -l)"
          else
            echo "❌ CSS文件不存在"
            exit 1
          fi

          # 显示构建产物大小
          echo "📏 构建产物大小统计:"
          du -sh dist/*
          echo "✅ 构建验证通过"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/test' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.build.outputs.build-version }}
          path: dist/

      - name: Prepare deployment package
        run: |
          echo "=== 开始准备前端部署包 ==="
          echo "开始时间: $(date)"

          # 创建前端部署包
          echo "打包前端构建产物..."
          cd dist
          tar -czf ../frontend-dist.tar.gz .
          cd ..

          # 显示包大小
          echo "前端部署包大小: $(du -h frontend-dist.tar.gz | cut -f1)"
          echo "=== 前端部署包准备完成 ==="

      - name: SCP upload package to jump server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          port: ${{ secrets.TEST_SERVER_PORT || 22 }}
          source: "frontend-dist.tar.gz"
          target: "/tmp/"

      - name: Deploy to target server via jump server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          port: ${{ secrets.TEST_SERVER_PORT || 22 }}
          script: |
            echo "=== 开始目标机器前端部署 ==="
            echo "部署开始时间: $(date)"
            echo ""

            # 🚀 从跳板机部署到测试服务器
            echo "🚀 从跳板机部署到测试服务器..."
            echo "目标机器: 172.25.230.46"

            # 配置SSH密钥用于连接目标机器
            mkdir -p ~/.ssh
            echo "${{ secrets.TEST_SERVER_SSH_KEY }}" > ~/.ssh/target_key
            chmod 600 ~/.ssh/target_key

            # 检查部署文件是否存在
            echo "检查前端部署文件..."
            ls -la /tmp/frontend-dist.tar.gz || { echo "❌ 前端部署包不存在"; exit 1; }

            # 传输部署文件到目标机器
            echo "传输前端部署文件到目标机器..."
            scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/target_key /tmp/frontend-dist.tar.gz ecs-user@172.25.230.46:/tmp/

            # 在目标机器上执行前端部署
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/target_key ecs-user@172.25.230.46 << 'EOF'
              set -e

              echo "切换到root用户执行前端部署..."
              sudo su - << 'ROOT_EOF'
              set -e

              # 创建前端部署目录（如果不存在）
              echo "准备前端部署目录..."
              mkdir -p /var/www/livechat-frontend-customer

              # 备份当前版本（可选）
              if [ -d "/var/www/livechat-frontend-customer.bak" ]; then
                echo "清理旧备份..."
                rm -rf /var/www/livechat-frontend-customer.bak
              fi

              if [ -d "/var/www/livechat-frontend-customer" ] && [ "$(ls -A /var/www/livechat-frontend-customer)" ]; then
                echo "备份当前版本..."
                mv /var/www/livechat-frontend-customer /var/www/livechat-frontend-customer.bak
                mkdir -p /var/www/livechat-frontend-customer
              fi

              # 从部署包中提取前端文件
              echo "从部署包中提取前端文件..."
              tar -xzf /tmp/frontend-dist.tar.gz -C /var/www/livechat-frontend-customer/
              echo "✅ 前端文件提取完成"

              # 设置正确的权限
              echo "设置文件权限..."
              chown -R www-data:www-data /var/www/livechat-frontend-customer/ || true
              chmod -R 755 /var/www/livechat-frontend-customer/

              # 🚀 部署完成验证
              echo ""
              echo "🚀 前端部署完成验证..."
              echo "部署版本: ${{ github.sha }}"
              echo "部署时间: $(date)"

              # 检查部署目录
              echo "检查部署目录内容..."
              ls -la /var/www/livechat-frontend-customer/ | head -10

              # 检查主要文件是否存在
              if [ -f "/var/www/livechat-frontend-customer/index.html" ]; then
                echo "✅ index.html 存在"
              else
                echo "❌ index.html 不存在"
                exit 1
              fi

              # 检查构建产物
              if [ -d "/var/www/livechat-frontend-customer/js" ] && [ "$(ls -A /var/www/livechat-frontend-customer/js/*.js 2>/dev/null | wc -l)" -gt 0 ]; then
                echo "✅ JS文件存在"
                echo "📊 JS文件数量: $(ls -A /var/www/livechat-frontend-customer/js/*.js 2>/dev/null | wc -l)"
              else
                echo "❌ JS文件不存在"
                exit 1
              fi

              if [ -d "/var/www/livechat-frontend-customer/css" ] && [ "$(ls -A /var/www/livechat-frontend-customer/css/*.css 2>/dev/null | wc -l)" -gt 0 ]; then
                echo "✅ CSS文件存在"
                echo "📊 CSS文件数量: $(ls -A /var/www/livechat-frontend-customer/css/*.css 2>/dev/null | wc -l)"
              else
                echo "❌ CSS文件不存在"
                exit 1
              fi

              # 显示文件大小
              echo "文件大小统计:"
              du -sh /var/www/livechat-frontend-customer/

              # 清理临时文件
              echo "清理临时部署文件..."
              rm -f /tmp/frontend-dist.tar.gz

              echo ""
              echo "🎉 客服前端部署成功！"
              echo "🏷️  部署版本: ${{ github.sha }}"
              echo "🕒 完成时间: $(date)"
              echo ""
              echo "📋 访问地址: https://chat-t.zmyyc.com/customer/"
              echo "🔗 API地址: ${{ env.API_BASE_URL }}"

            ROOT_EOF

            EOF

            echo "✅ SSH跳转前端部署完成"

      - name: Send deployment notification
        run: |
          echo "📢 发送前端部署通知..."
          DEPLOY_INFO="🚀 客服前端部署完成
          📅 时间: $(date)
          🏷️ 版本: ${{ github.sha }}
          🌐 环境: ${{ env.BUILD_MODE }}
          📋 访问: https://chat-t.zmyyc.com/customer/
          🔗 API: ${{ env.API_BASE_URL }}
          📊 构建产物大小: $(du -sh dist | cut -f1)
          ✅ 状态: 部署成功"

          echo "$DEPLOY_INFO"
          # 这里可以集成其他通知服务，如 Slack、钉钉等
